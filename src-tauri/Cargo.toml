[package]
name = "growmanager"
version = "0.5.3"
edition = "2021"

[dependencies]
tauri = { version = "1", features = ["shell-open", "dialog-save", "fs-write-file", "window-close", "window-set-size", "window-set-position", "window-maximize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2"
sha2 = "0.10"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
